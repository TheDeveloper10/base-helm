# Default values for base-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# ==== Custom Values

# This is for setting up the container startup command
command: []
args: []

# This is for setting up the environment variables
env: {}
# MY_ENV_VAR: <value>
envFrom: []
# - secretRef:
#     name: my-secret
#     items: # optional
#       - key: username
#         path: my-group/my-username
# - configMapRef:
#     name: my-configmap
#     items: # optional
#       - key: password

deploymentStrategy:
  type: RollingUpdate # Recreate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  # First port is main (this is the port the HTTPRoute sends traffic to)
  ports:
    - name: http
      containerPort: 80
      servicePort: 80
      protocol: TCP

customResources: ""
# customResources: |
#   apiVersion: gateway.nginx.org/v1alpha1
#   kind: SnippetsFilter
#   metadata:
#     name: minimal-snippet
#   spec:
#     snippets:
#     - context: http.server.location
#       value: add_header X-Example "example";

# ==== Default Helm Chart

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: nginx
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Gateway API. Replaces the Ingress support removed in chart 1.2.0.
# This chart only manages resources belonging to the application itself, so the
# Gateway is expected to already exist and is referenced by httpRoute.parentRefs.
# The HTTPRoute is plain Gateway API, the routePolicies below render
# gateway.nginx.org CRDs and need NGINX Gateway Fabric:
# https://docs.nginx.com/nginx-gateway-fabric/

# This block replaces the old ingress block. More information can be found here: https://gateway-api.sigs.k8s.io/api-types/httproute/
httpRoute:
  enabled: false
  annotations: {}
  # Gateways to attach to. Required, this chart does not create the Gateway.
  parentRefs: []
  # - name: gateway
  #   namespace: nginx-gateway
  #   sectionName: http
  hostnames: []
  # - chart-example.local
  matches:
    - path:
        type: PathPrefix
        value: /
  # Extra filters, appended after the CORS filter generated from
  # routePolicies.cors below.
  filters: []
  # - type: RequestHeaderModifier
  #   requestHeaderModifier:
  #     set:
  #       - name: X-Example
  #         value: example
  timeouts: {}
  # request: 30s
  # backendRequest: 30s
  # Service port to route to. Defaults to the first entry of service.ports.
  backendPort: ""
  # Set to write spec.rules verbatim, ignoring matches/filters/timeouts above.
  rules: []

# Traffic policies for the HTTPRoute above. CORS is a core Gateway API filter,
# the rest are NGINX Gateway Fabric CRDs targeting this application's route.
routePolicies:
  # CORS is a core Gateway API HTTPRoute filter, so it is rendered onto the
  # HTTPRoute above rather than into a separate resource.
  cors:
    enabled: false
    # Required when enabled. Each entry is scheme://host[:port], with no
    # trailing slash. A single * allows any origin, but cannot be combined
    # with allowCredentials below.
    allowOrigins: []
    # - https://www.example.com
    # - https://*.example.com
    # Left empty, the Gateway API default of simple methods applies.
    allowMethods: []
    # - GET
    # - POST
    allowHeaders: []
    exposeHeaders: []
    # Lets browsers send cookies and Authorization headers cross-origin.
    allowCredentials: false
    # Preflight cache lifetime in seconds. 0 omits the field.
    maxAge: 0

  # https://docs.nginx.com/nginx-gateway-fabric/traffic-management/rate-limit/
  rateLimit:
    enabled: false
    annotations: {}
    requests: 100
    # Second or Minute. NGINX limit_req accepts no other rates.
    unit: Second
    # Requests allowed to exceed the rate before traffic is rejected with a 429.
    # Bursting requests are passed through immediately rather than queued.
    burst: 0
    # What the limit is counted per. ClientIP buckets on the client address,
    # Header on the value of headerName below.
    key: ClientIP
    headerName: ""
    # X-API-Key

  # Max request body size and other client connection settings.
  # https://docs.nginx.com/nginx-gateway-fabric/traffic-management/client-settings/
  clientSettings:
    enabled: false
    annotations: {}
    body:
      # Max request body size in NGINX size form. A bare number is bytes,
      # otherwise use a k/m/g suffix. 0 disables the limit entirely.
      maxSize: ""
      bufferSize: ""
      timeout: ""
    keepAlive: {}
    # requests: 100
    # time: 1h
    # timeout:
    #   server: 75s
    #   header: 60s

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
enableLivenessProbe: true # to not have to remove the livenessProbe.enabled field
livenessProbe:
  httpGet:
    path: /
    port: http
enableReadinessProbe: true # to not have to remove the readinessProbe.enabled field
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false
# - name: bar
#   configMap:
#     name: myconfigmap
#     optional: false
# - name: baz
#   emptyDir: {}
# - name: qux
#   hostPath:
# - name: quux
#   persistentVolumeClaim:
#     claimName: myclaim

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: false

initContainers: []

nodeSelector: {}

tolerations: []

affinity: {}
