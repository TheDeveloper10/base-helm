# Default values for base-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# ==== Custom Values

# This is for setting up the container startup command
command: []
args: []

# This is for setting up the environment variables
env: {}
# MY_ENV_VAR: <value>
envFrom: []
# - secretRef:
#     name: my-secret
#     items: # optional
#       - key: username
#         path: my-group/my-username
# - configMapRef:
#     name: my-configmap
#     items: # optional
#       - key: password

deploymentStrategy:
  type: RollingUpdate # Recreate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  # First port is main (this is the port the HTTPRoute sends traffic to)
  ports:
    - name: http
      containerPort: 80
      servicePort: 80
      protocol: TCP

customResources: ""
# customResources: |
#   apiVersion: gateway.nginx.org/v1alpha1
#   kind: SnippetsFilter
#   metadata:
#     name: minimal-snippet
#   spec:
#     snippets:
#     - context: http.server.location
#       value: add_header X-Example "example";

# ==== Default Helm Chart

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: nginx
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Defaults to the restricted Pod Security Standard. An image that needs to write
# to disk should mount an emptyDir rather than relax readOnlyRootFilesystem, and
# an image with a non-root USER of its own only needs runAsUser overridden here.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# TODO: remove (currently available for backward compatibility)
# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Gateway API. Replaces the Ingress support removed in chart 1.2.0.
# This chart only manages resources belonging to the application itself, so the
# Gateway is expected to already exist and is referenced by httpRoute.parentRefs.
# The HTTPRoute is plain Gateway API, the routePolicies below render
# implementation specific CRDs selected by routePolicies.provider:
# envoy: https://gateway.envoyproxy.io/
# nginx: https://docs.nginx.com/nginx-gateway-fabric/

# This block replaces the old ingress block. More information can be found here: https://gateway-api.sigs.k8s.io/api-types/httproute/
httpRoute:
  enabled: false
  annotations: {}
  # Gateway the ListenerSet (or the default parentRefs) attach to.
  gateway:
    name: main
    namespace: gateway
  # ListenerSet with one HTTPS listener per hostname (named https-<hostname>),
  # terminating TLS with the secret from tls.certificate. The secret stays in
  # the release namespace, so no ReferenceGrant is needed. The Gateway must
  # allow it via spec.allowedListeners.
  # https://gateway-api.sigs.k8s.io/geps/gep-1713/
  listenerSet:
    enabled: true
    annotations: {}
    port: 443
  # Left empty, one ref per hostname is generated. With listenerSet enabled:
  # {group: gateway.networking.k8s.io, kind: ListenerSet, name: <fullname>, sectionName: https-<hostname>}
  # otherwise:
  # {name: <gateway.name>, namespace: <gateway.namespace>, sectionName: https-<hostname>}
  # Wildcard hostnames need explicit parentRefs and listenerSet disabled.
  parentRefs: []
  # - name: main
  #   namespace: gateway
  #   sectionName: https-chart-example.local
  hostnames: []
  # - chart-example.local
  matches:
    - path:
        type: PathPrefix
        value: /
  # Extra filters, appended after the CORS filter generated from
  # routePolicies.cors below.
  filters: []
  # - type: RequestHeaderModifier
  #   requestHeaderModifier:
  #     set:
  #       - name: X-Example
  #         value: example
  timeouts: {}
  # request: 30s
  # backendRequest: 30s
  # Service port to route to. Defaults to the first entry of service.ports.
  backendPort: ""
  # Set to write spec.rules verbatim, ignoring matches/filters/timeouts above.
  rules: []

# Traffic policies for the HTTPRoute above. CORS is a core Gateway API filter,
# the rest are gateway specific CRDs targeting this application's route.
routePolicies:
  # envoy: Envoy Gateway BackendTrafficPolicy / SecurityPolicy
  # nginx: NGINX Gateway Fabric RateLimitPolicy / ClientSettingsPolicy
  provider: envoy

  # CORS is a core Gateway API HTTPRoute filter, so it is rendered onto the
  # HTTPRoute above rather than into a separate resource.
  cors:
    enabled: false
    # Required when enabled. Each entry is scheme://host[:port], with no
    # trailing slash. A single * allows any origin, but cannot be combined
    # with allowCredentials below.
    allowOrigins: []
    # - https://www.example.com
    # - https://*.example.com
    # Left empty, the Gateway API default of simple methods applies.
    allowMethods: []
    # - GET
    # - POST
    allowHeaders: []
    exposeHeaders: []
    # Lets browsers send cookies and Authorization headers cross-origin.
    allowCredentials: false
    # Preflight cache lifetime in seconds. 0 omits the field.
    maxAge: 0

  # envoy: BackendTrafficPolicy rateLimit.local, limits apply per Envoy replica.
  #   https://gateway.envoyproxy.io/docs/tasks/traffic/local-rate-limit/
  # nginx: RateLimitPolicy
  #   https://docs.nginx.com/nginx-gateway-fabric/traffic-management/rate-limit/
  rateLimit:
    enabled: false
    annotations: {}
    requests: 100
    # nginx: Second or Minute. envoy: Second, Minute, Hour, Day, Month or Year.
    unit: Second
    # nginx only. Requests allowed to exceed the rate before traffic is rejected
    # with a 429, passed through immediately rather than queued. Ignored by envoy.
    burst: 0
    # What the limit is counted per. ClientIP buckets on the client address,
    # Header on the value of headerName below. With envoy behind a load
    # balancer, the Gateway needs clientIPDetection for ClientIP to be useful.
    key: ClientIP
    headerName: ""
    # X-API-Key

  # envoy only, rendered together with extAuth into one SecurityPolicy.
  securityPolicyAnnotations: {}

  # envoy only. Denies every request whose client address is not in cidrs.
  # https://gateway.envoyproxy.io/docs/tasks/security/restrict-ip-access/
  ipAllowList:
    enabled: false
    cidrs: []
    # - 10.0.0.0/8

  # envoy only. HTTP external authorization.
  # https://gateway.envoyproxy.io/docs/tasks/security/ext-auth/
  # A service in another namespace needs a ReferenceGrant there allowing
  # SecurityPolicy from this namespace, this chart does not create it.
  extAuth:
    enabled: false
    service: ""
    # Defaults to the release namespace.
    namespace: ""
    port: 80
    # Path the authorization request is sent to. Empty uses the root path.
    path: ""
    # Client request headers sent to the auth service. Envoy's HTTP ext auth
    # only sends Host, Method, Path, Content-Length and Authorization by default,
    # so cookies etc. must be listed here.
    headersToExtAuth: []
    # - cookie
    # - x-forwarded-for
    # Headers from the auth response forwarded to the backend.
    headers: []
    # - x-user-id

  # nginx only. Max request body size and other client connection settings.
  # Ignored with provider envoy, body size is configured on the Gateway there.
  # https://docs.nginx.com/nginx-gateway-fabric/traffic-management/client-settings/
  clientSettings:
    enabled: false
    annotations: {}
    body:
      # Max request body size in NGINX size form. A bare number is bytes,
      # otherwise use a k/m/g suffix. 0 disables the limit entirely.
      maxSize: ""
      bufferSize: ""
      timeout: ""
    keepAlive: {}
    # requests: 100
    # time: 1h
    # timeout:
    #   server: 75s
    #   header: 60s

# cert-manager Certificate for the HTTPRoute hostnames. The secret lives in the
# release namespace and is used by httpRoute.listenerSet. Without a ListenerSet
# a ReferenceGrant is rendered instead, letting the Gateway namespaces from the
# parentRefs read it; point the Gateway listener's certificateRefs at it.
tls:
  certificate:
    enabled: false
    annotations: {}
    # Defaults to <fullname>-tls.
    secretName: ""
    # Defaults to httpRoute.hostnames.
    dnsNames: []
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    duration: ""
    renewBefore: ""

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
enableLivenessProbe: true # to not have to remove the livenessProbe.enabled field
livenessProbe:
  httpGet:
    path: /
    port: http
enableReadinessProbe: true # to not have to remove the readinessProbe.enabled field
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false
# - name: bar
